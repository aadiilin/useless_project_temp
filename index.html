<body>
  <div class="app-shell"><header><div class="nav"><button class="brand" onclick="go('home')"><span class="brand-mark">◉</span>WHERE AM I <span class="cyan">NOT?</span></button><nav><button data-nav="create" onclick="go('create')">Create absence</button><button data-nav="history" onclick="go('history')">History</button><button data-nav="about" onclick="go('about')">About</button></nav><button class="btn primary" onclick="go('create')">Start absence ↗</button></div></header><div id="app"></div></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
  <script>
    const places=[{name:'Paris',country:'France',lat:48.8566,lng:2.3522},{name:'Tokyo',country:'Japan',lat:35.6762,lng:139.6503},{name:'Dubai',country:'United Arab Emirates',lat:25.2048,lng:55.2708},{name:'New York',country:'United States',lat:40.7128,lng:-74.006},{name:'Antarctica',country:'Earth (cold)',lat:-82.8628,lng:135},{name:'Moon',country:'Somewhere above us',lat:0,lng:0},{name:'Mars',country:'Definitely not Earth',lat:0,lng:0}];
    const messages=['Reality has been consulted.','No unnecessary evidence was found.','Our extremely sophisticated system agrees.','The coordinates look suspiciously far away.','We checked. You weren\'t there.','This information will probably change nothing.'];
    const steps=['Analyzing coordinates…','Simulating presence…','Consulting reality…','Checking whether you were actually there…'];
    let state={view:'home',name:'',query:'',selected:null,progress:0,message:messages[0],more:0,map:null,marker:null};
    const app=document.getElementById('app');
    const getHistory=()=>JSON.parse(localStorage.getItem('absences')||'[]');
    const saveAbsence=a=>localStorage.setItem('absences',JSON.stringify([a,...getHistory()].slice(0,30)));
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function go(view){state.view=view;state.map=null;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));render();window.scrollTo({top:0,behavior:'smooth'});}
    function layout(content,foot=true){return `<main class="page fade">${content}</main>${foot?'<footer class="foot"><div class="foot-inner"><span>WHERE AM I NOT? © 2026</span><strong>USEFULNESS: 0% &nbsp; / &nbsp; ENTERTAINMENT: 100%</strong></div></footer>':''}`}
    function render(){setNavbar();if(state.view==='home'){renderLanding();mountActions()}if(state.view==='create')renderCreate();if(state.view==='loading')renderLoading();if(state.view==='result')renderResult();if(state.view==='certificate')renderCertificate();if(state.view==='history')renderHistory();if(state.view==='about')renderAbout();}
    function setNavbar(){const header=document.querySelector('header');if(header)header.innerHTML='<a class="logo link" href="#" onclick="go(\'home\');return false">TinkerHub</a><button class="index-button" onclick="go(\'home\')">INDEX</button>';if(header)header.className='navbar'}
    function mountActions(){const learning=document.querySelector('.learning');if(learning)learning.insertAdjacentHTML('afterend',`<section class="action-list"><h2>What happens next</h2><article class="action"><span>01</span><div><h3>Learn &amp; Lead</h3><p>Dive into peer-driven learning stations and discover how absence can become a practice.</p></div></article><article class="action"><span>02</span><div><h3>Build &amp; Innovate</h3><p>Turn ideas into reality, even when the reality is entirely fictional.</p></div></article><article class="action"><span>03</span><div><h3>Connect &amp; Grow</h3><p>Network with industry pros and other people who were definitely not there.</p></div></article></section>`);document.querySelectorAll('.editorial-hero,.learning,.action-list').forEach(el=>el.classList.add('reveal'));setupReveal()}
    function setupReveal(){if(!('IntersectionObserver' in window)){document.querySelectorAll('.reveal').forEach(el=>el.classList.add('visible'));return}const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target)}}),{threshold:.15});document.querySelectorAll('.reveal:not(.visible)').forEach(el=>observer.observe(el))}
    function renderLanding(){app.innerHTML=layout(`<section class="editorial-hero"><div><p class="editorial-kicker">Absence intelligence / v. 3.7</p><h1 class="editorial-title">the space between<br><em>dream &amp;<br>reality</em></h1><p class="editorial-sub">A premium interface for imaginary presence, definitive absence, and information that changes absolutely nothing.</p><div class="actions"><button class="btn primary" onclick="go('create')">Start my absence ↗</button><button class="btn" onclick="go('about')">Read the premise</button></div></div><div class="editorial-visual"><div class="editorial-image"></div><div class="editorial-caption">A visual representation of somewhere you are not. Coordinates intentionally unavailable.</div></div></section><section class="learning"><div class="learning-number">01</div><div><h2>Learning Paradigm</h2><div class="learning-copy"><strong>Imagine first.<br>Verify later.</strong><p>WHERE AM I NOT? uses the language of serious technology to explore an unserious question. Select a destination, enter a fictional presence, and receive an officially unofficial confirmation that you were not there.</p></div></div></section>`)}
    function fakeWorld(){return `<div class="world"><div class="orbit" style="left:35%;top:27%"></div><div class="orbit" style="left:45%;top:31%;transform:scale(1.55);opacity:.4"></div><div class="continent" style="left:9%;top:18%;height:33%;width:28%;transform:rotate(-10deg)"></div><div class="continent" style="left:32%;top:30%;height:45%;width:23%;transform:rotate(12deg)"></div><div class="continent" style="left:55%;top:14%;height:32%;width:26%;transform:rotate(8deg)"></div><div class="continent" style="left:64%;top:57%;height:24%;width:18%;transform:rotate(-15deg)"></div><div class="pin" style="left:26%;top:31%">PARIS</div><div class="pin" style="left:69%;top:34%">TOKYO</div><div class="pin" style="left:57%;top:58%">DUBAI</div><div class="pin" style="left:45%;top:44%">YOU ARE NOT HERE</div><div class="map-label"><span class="pulse" style="display:inline-block;width:8px;height:8px;background:var(--cyan);border-radius:50%;margin-right:8px"></span>Global absence network online</div><div style="position:absolute;right:18px;top:18px;text-align:right"><p class="eyebrow">Live simulations</p><p class="mono cyan" style="font-size:12px">0084.239.17</p></div></div>`}
    function renderHome(){app.innerHTML=layout(`<section class="hero"><div><p class="eyebrow">Absence intelligence / v. 3.7</p><h1 class="hero-title">WHERE<br><span class="cyan">AM I NOT?</span></h1><div class="hero-lede">Pretend you were there.<br><span class="muted">Prove you weren't.</span></div><div class="hero-desc">An unnecessarily sophisticated system for confirming that you were somewhere you definitely weren't.</div><div class="actions"><button class="btn primary" onclick="go('create')">Start my absence ↗</button><button class="btn" onclick="document.getElementById('why').hidden=!document.getElementById('why').hidden">Why does this exist? ↓</button></div><div id="why" class="glass" hidden style="max-width:420px;padding:16px;margin-top:16px;border-radius:16px;color:#b9c9cc;font-size:13px;line-height:1.7">Every modern application solves an important problem. We decided to do the opposite. Sometimes technology doesn't need a purpose.</div><div class="stats"><div><strong>1,284,921</strong><span>Places you weren't</span></div><div><strong>1</strong><span>Places you were</span></div><div><strong class="lime">0.00%</strong><span>Useful information</span></div></div></div><div style="position:relative">${fakeWorld()}<div class="glass verdict"><div class="eyebrow lime"><span class="pulse" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:7px"></span>System verdict</div><p>You were not there.</p><small class="muted">A definitive, useless conclusion.</small></div></div></section><div class="ticker"><div class="ticker-inner"><span>◌ 100% simulated experience</span><span>⌁ Powered by coordinates, imagination &amp; no evidence</span><span>◌ For entertainment only</span></div></div><section class="protocol"><div class="protocol-grid"><div><p class="eyebrow">The absence protocol</p><h2>A premium<br><span class="cyan">solution</span> to<br>nothing.</h2></div><div class="cards"><div class="glass card"><span class="mono cyan">01 /</span><h3>Select anywhere</h3><p>Paris, Mars, or the middle of an ocean. Your imaginary itinerary awaits.</p></div><div class="glass card"><span class="mono lime">02 /</span><h3>Simulate presence</h3><p>Our advanced non-evidence engine places you there for approximately 7 seconds.</p></div><div class="glass card wide"><span class="mono coral">03 /</span><h3>Prove absence</h3><p>A dramatic reality check confirms the obvious, then issues a certificate no one asked for.</p></div></div></div></section>`)}
    function renderCreate(){app.innerHTML=layout(`<div class="section-head"><div><p class="eyebrow">Absence protocol / create</p><h1>Build your <span class="cyan">absence.</span></h1></div><button class="btn no-print" onclick="go('history')">View history ↗</button></div><div class="two-col"><div class="glass panel"><div style="display:flex;justify-content:space-between;gap:12px"><p class="eyebrow">01 / Identity</p><span class="mono muted" style="font-size:9px">OPTIONAL, BUT DRAMATIC</span></div><label for="name" style="display:block;margin-top:45px;font-size:13px">What is your name?</label><input id="name" class="field" placeholder="e.g. Mohammed Adil S" value="${esc(state.name)}" oninput="state.name=this.value"><p class="muted" style="font-size:12px;margin-top:10px">We need someone to not be there.</p><div class="fine-print"><p class="eyebrow">The fine print</p><p>All results are fictional simulations for entertainment. No GPS evidence will be created, because that would be both difficult and unnecessary.</p></div></div><div class="glass panel" style="padding:0;overflow:hidden"><div style="display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:26px;border-bottom:1px solid var(--line)"><div><p class="eyebrow">02 / Destination</p><h2>Where do you want to pretend you were?</h2></div><div class="search"><input id="query" class="field" placeholder="Search a place…" value="${esc(state.query)}" oninput="state.query=this.value;showSuggestions()"><div id="suggestions" class="suggestions" hidden></div></div></div><div class="map-wrap"><div id="map" style="height:100%"></div><div class="popular">${places.map(p=>`<button class="chip" onclick="choose('${p.name}')">${p.name}</button>`).join('')}</div></div><div class="selected-row" style="padding:22px 26px"><div>${state.selected?`<p class="eyebrow">Destination selected</p><div style="font-size:18px;margin-top:5px">${esc(state.selected.name)} <span class="muted" style="font-size:13px">${esc(state.selected.country)}</span></div>`:'<p class="muted" style="font-size:13px">Select a location on the map or choose a popular destination.</p>'}</div><button class="btn primary" ${state.name.trim()&&state.selected?'':'disabled'} onclick="begin()">Prepare fictional presence →</button></div></div></div>`);initMap();}
    function showSuggestions(){const box=document.getElementById('suggestions');const q=state.query.toLowerCase();const list=places.filter(p=>(p.name+' '+p.country).toLowerCase().includes(q));if(!q||!list.length){box.hidden=true;return}box.innerHTML=list.map(p=>`<button onclick="choose('${p.name}')"><span class="cyan">${p.name}</span> <span class="muted">${p.country}</span></button>`).join('');box.hidden=false}
    function choose(name){state.selected=places.find(p=>p.name===name)||{name:'Selected coordinates',country:'Earth',lat:0,lng:0};state.query=state.selected.name;renderCreate()}
    function initMap(){const el=document.getElementById('map');if(!el||!window.L)return;state.map=L.map(el,{worldCopyJump:true}).setView([22,10],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(state.map);state.map.on('click',e=>{state.selected={name:'Selected coordinates',country:'Earth',lat:e.latlng.lat,lng:e.latlng.lng};state.query='Selected coordinates';renderCreate()});if(state.selected&&state.selected.lat!==0)state.marker=L.marker([state.selected.lat,state.selected.lng]).addTo(state.map).bindPopup('<strong>'+esc(state.selected.name)+'</strong><br>Fictional destination marker').openPopup()}
    function begin(){if(!state.name.trim()||!state.selected)return;state.view='loading';state.progress=0;renderLoading();let t=setInterval(()=>{state.progress++;renderLoading();if(state.progress>=4){clearInterval(t);state.message=messages[Math.floor(Math.random()*messages.length)];state.view='result';renderResult()}},850)}
    function renderLoading(){app.innerHTML=layout(`<div class="loading"><p class="eyebrow">Destination selected / ${esc(state.selected?.name)}</p><h2>Preparing<br><span class="cyan">fictional presence.</span></h2><div class="glass loading-box"><div style="display:flex;justify-content:space-between;margin-bottom:28px"><span class="mono cyan" style="font-size:11px">SIMULATION_ENGINE</span><span class="mono muted" style="font-size:11px">${String(state.progress*25).padStart(3,'0')}%</span></div>${steps.map((s,i)=>`<div class="load-item" style="opacity:${i<state.progress?1:.35}"><div class="load-line"><span>${i<state.progress?'✓':'○'} &nbsp;${s}</span><span class="mono muted" style="font-size:10px">${i<state.progress?'COMPLETE':'WAITING'}</span></div><div class="bar"><i style="width:${i<state.progress?100:0}%"></i></div></div>`).join('')}</div><p class="muted" style="font-size:11px;margin-top:22px">Every result on this screen is fictional and simulated.</p></div>`)}
    function currentAbsence(){const p=state.selected;const absurd=['Moon','Mars','Antarctica'].includes(p.name);const distance=p.name==='Moon'?'384,400 km':p.name==='Mars'?'225M km':Math.max(6420,Math.round(Math.abs((p.lng||0)-78.9)*71)).toLocaleString()+' km';return{id:'WAIN-'+Date.now().toString(36).toUpperCase(),name:state.name.trim(),destination:p.name,country:p.country,date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),time:new Date().toLocaleTimeString('en-GB'),confidence:'99.99%',distance,uselessness:(97.2+(absurd?2.1:1.3)).toFixed(2)+'%'}}
    function renderResult(){const a=currentAbsence();const special=a.destination==='Moon'?'Distance detected: unnecessarily far.':a.destination==='Mars'?'We strongly recommend remaining on Earth.':a.destination==='Antarctica'?'Excellent choice. Nobody needed this verification.':a.destination==='Selected coordinates'?'Congratulations. You have chosen somewhere extremely inconvenient to be.':'';app.innerHTML=layout(`<div class="result-head"><div><p class="eyebrow"><span class="pulse" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-right:8px"></span>Result ready / fictional simulation</p><h1>YOU WERE<br><span class="coral">NOT THERE.</span></h1></div><div class="confidence"><p class="eyebrow">Absence confidence</p><strong>99.99%</strong></div></div><div class="result-grid"><div><div class="tabs"><button class="btn tab on" id="verifyTab" onclick="showTab('verify')">Verification</button><button class="btn tab" id="presenceTab" onclick="showTab('presence')">Imaginary presence</button></div><div id="resultPanel" class="glass result-card"><p class="eyebrow">Reality check / definitive</p><h2>${esc(state.message)}</h2>${special?`<div style="padding:12px;border:1px solid rgba(116,230,234,.2);border-radius:12px;color:var(--cyan);font-size:12px">${special}</div>`:''}<div class="metrics"><div class="metric"><label>Distance from selected location</label><b>${a.distance}</b></div><div class="metric"><label>Reality status</label><b class="coral">NOT THERE</b></div><div class="metric"><label>Presence status</label><b class="cyan">FICTIONAL</b></div><div class="metric"><label>Useful information gained</label><b>0</b></div><div class="metric"><label>Uselessness level</label><b class="lime">MAXIMUM</b></div></div></div></div><div><div class="glass panel"><p class="eyebrow">The absence timeline</p><div class="timeline" style="margin-top:24px">${[['15:42:01','Location selected'],['15:42:03','Imaginary presence generated'],['15:42:07','Reality consulted'],['15:42:08','Absence confirmed'],['15:42:09','Certificate prepared'],['15:42:10','Your time was successfully wasted']].map(x=>`<div class="event"><div><time>${x[0]}</time><span>${x[1]}</span></div></div>`).join('')}</div></div><div class="useless"><div class="useless-head"><p class="eyebrow lime">Uselessness score</p><span class="useless-score">${a.uselessness}</span></div><p class="muted" style="font-size:12px;line-height:1.6">This score has absolutely no scientific basis.</p><button class="btn" style="padding:9px 12px;font-size:9px;border-color:rgba(182,240,127,.2)" onclick="makeMoreUseless()">Make my absence more useless ↗</button><div id="moreText"></div></div></div></div><div class="actions"><button class="btn primary" onclick="go('certificate');saveCurrent()">Generate certificate ↗</button><button class="btn" onclick="saveCurrent();go('history')">Save &amp; view history</button></div><p class="disclaimer">FOR ENTERTAINMENT ONLY — NOT AN OFFICIAL DOCUMENT.</p>`)}
    function showTab(tab){const panel=document.getElementById('resultPanel');document.getElementById('verifyTab').classList.toggle('on',tab==='verify');document.getElementById('presenceTab').classList.toggle('on',tab==='presence');const a=currentAbsence();panel.innerHTML=tab==='verify'?`<p class="eyebrow">Reality check / definitive</p><h2>${esc(state.message)}</h2><div class="metrics"><div class="metric"><label>Distance from selected location</label><b>${a.distance}</b></div><div class="metric"><label>Reality status</label><b class="coral">NOT THERE</b></div><div class="metric"><label>Presence status</label><b class="cyan">FICTIONAL</b></div><div class="metric"><label>Useful information gained</label><b>0</b></div><div class="metric"><label>Uselessness level</label><b class="lime">MAXIMUM</b></div></div>`:`<p class="eyebrow cyan">Your imaginary presence</p><h2>We placed you in ${esc(a.destination)}.</h2><p>For approximately 7 seconds, our imagination placed you here. This is a simulated experience, not proof of travel or physical presence.</p><div class="metrics"><div class="metric"><label>Name</label><b>${esc(a.name)}</b></div><div class="metric"><label>Destination</label><b>${esc(a.destination)}</b></div><div class="metric"><label>Status</label><b class="lime">SIMULATED</b></div><div class="metric"><label>Reality check</label><b class="coral">You were NOT there.</b></div></div>`}
    function makeMoreUseless(){state.more++;document.getElementById('moreText').innerHTML=`<div class="more-text">Your absence has been verified ${17+state.more} times.<br>You were not there: ${(1847392+state.more*31415).toLocaleString()} seconds.<br>People who care: Probably 0<br>Scientific significance: None. Historical significance: Also none.</div>`}
    function saveCurrent(){const a=currentAbsence();saveAbsence(a);localStorage.setItem('currentAbsence',JSON.stringify(a))}
    function getCurrent(){return JSON.parse(localStorage.getItem('currentAbsence')||'null')||{id:'WAIN-DEMO-000',name:'Mohammed Adil S',destination:'Tokyo',country:'Japan',date:'12 Sep 2026',time:'15:42:10',confidence:'99.99%',distance:'6,420 km',uselessness:'99.97%'}}
    function renderCertificate(){const a=getCurrent();app.innerHTML=layout(`<div class="section-head no-print"><div><p class="eyebrow">Archive / certificate</p><h1>The official<br><span class="cyan">unofficial</span> record.</h1></div><div class="actions" style="margin:0"><button class="btn primary" onclick="downloadCert()">Download certificate ↓</button><button class="btn" onclick="window.print()">Print</button></div></div><div id="certificate" class="certificate"><div class="certificate-inner"><div style="display:flex;justify-content:space-between;align-items:start"><div><p class="mono" style="font-size:9px;color:#397878">WAIN / ABSENCE INTELLIGENCE LAB</p><p style="font-size:10px;color:#5d7778;letter-spacing:.16em">Verification file · ${esc(a.id)}</p></div><span style="display:grid;place-items:center;width:40px;height:40px;border:1px solid rgba(57,120,120,.4);border-radius:50%;color:#145c5c">◉</span></div><div class="certificate-title"><p style="font-style:normal;text-transform:uppercase;letter-spacing:.4em;font-size:10px">Officially Unofficial Verification of Absence</p><h1>Certificate of<br>Not Being There</h1><p>This certifies that</p><div class="name">${esc(a.name)}</div><p>was officially NOT PRESENT at</p><h2 style="margin:8px 0;color:#123a3c">${esc(a.destination)}, ${esc(a.country)}</h2><div style="color:#5d7778;font-size:13px">on ${esc(a.date)} · ${esc(a.time)}</div></div><div class="certificate-grid"><div class="certificate-metrics"><div><div class="cert-label">Absence confidence</div><div class="cert-value">${a.confidence}</div></div><div><div class="cert-label">Distance</div><div class="cert-value">${a.distance}</div></div></div><div class="seal"><div><b style="font-size:9px;letter-spacing:.15em">VERIFIED</b><br><b style="font-size:18px">ABSENT™</b><br><small style="font-size:8px">ABSENCE LAB</small></div></div><div><div class="cert-label" style="text-align:right">Uselessness score</div><div class="cert-value" style="text-align:right;font-size:20px">${a.uselessness}</div><div class="signature">Director of<br>Unnecessary Information</div></div></div><div class="certificate-foot"><span>The information contained herein is fictional, simulated, and has no legal, scientific, travel, or evidentiary value whatsoever.</span><strong>FOR ENTERTAINMENT ONLY<br>— NOT AN OFFICIAL DOCUMENT —</strong></div></div></div></div><div class="actions no-print"><button class="btn primary" onclick="go('create')">Create another absence ↗</button><button class="btn" onclick="go('history')">View all absences</button></div>`)}
    async function downloadCert(){const el=document.getElementById('certificate');if(window.html2canvas&&window.jspdf){const canvas=await html2canvas(el,{scale:2,backgroundColor:'#e9f0e8'});const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'px',format:[canvas.width,canvas.height]});pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,canvas.width,canvas.height);pdf.save('certificate-of-not-being-there.pdf')}else window.print()}
    function renderHistory(){const items=getHistory();app.innerHTML=layout(`<div class="section-head"><div><p class="eyebrow">Archive / personal absence log</p><h1>Your <span class="cyan">absences.</span></h1><p class="muted" style="max-width:430px;line-height:1.7">A completely private, local-only record of places you have not been. Nothing leaves this device.</p></div><div class="actions" style="margin:0"><button class="btn danger" ${items.length?'':'disabled'} onclick="localStorage.removeItem('absences');renderHistory()">Delete my absences</button><button class="btn primary" onclick="go('create')">New absence ↗</button></div></div>${items.length?`<div class="history-grid">${items.map((a,i)=>`<button class="glass absence-card" onclick="openHistory(${i})"><div class="absence-top"><div><p class="eyebrow">${esc(a.country)}</p><h2>${esc(a.destination)}</h2></div><span class="absent-tag">Absent</span></div><div class="absence-bottom"><div><div class="mono lime">${a.confidence}</div><small class="muted">Absence confidence</small></div><small class="muted">${esc(a.date)}</small></div></button>`).join('')}</div>`:`<div class="glass empty"><div class="empty-mark">◌</div><h2>No absences on file.</h2><p class="muted">An empty archive is a pristine archive.</p><button class="btn primary" onclick="go('create')">Create your first absence ↗</button></div>`}<p class="muted" style="text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.15em;margin-top:36px">All records are fictional simulations · stored in localStorage</p>`)}
    function openHistory(i){const a=getHistory()[i];localStorage.setItem('currentAbsence',JSON.stringify(a));go('certificate')}
    function renderAbout(){app.innerHTML=layout(`<div class="about-wrap"><p class="eyebrow">Manifesto / the original non-problem</p><h1 class="about-title">WHY DID<br><span class="cyan">WE BUILD</span><br>THIS?</h1><div class="about-grid"><p class="eyebrow">A note from the lab</p><div class="about-copy"><p>Every modern application tries to solve an important problem.</p><p>We decided to do the opposite.</p><p>“WHERE AM I NOT?” uses geolocation, interactive maps and unnecessarily sophisticated verification to answer a question nobody needed answered.</p><p class="cyan" style="font:32px/1.15 Georgia,serif">Because sometimes technology doesn't need a purpose.</p><p class="muted" style="font-size:13px">Every destination, score, presence and verification in this experience is fictional or simulated. This project does not create proof of travel, GPS evidence, bookings, receipts, government documents, or anything that could be mistaken for genuine evidence.</p><div class="callout">We spent a hackathon building proof that you weren't somewhere.</div></div></div><div class="actions"><button class="btn primary" onclick="go('create')">Start being absent ↗</button><button class="btn" onclick="go('home')">Return home</button></div></div>`)}
    document.addEventListener('input',event=>{if(event.target&&event.target.id==='name'){const button=document.querySelector('.selected-row .btn.primary');if(button)button.disabled=false}});
    render();
  </script>
