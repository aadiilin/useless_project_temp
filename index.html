s:80px 1fr;padding-block:28px;border-top:1px solid currentColor}.action:last-child{border-bottom:1px solid currentColor}.action>span{color:var(--accent);font:12px "Courier New",monospace}.action h3{margin:0;font:500 clamp(2rem,4vw,4rem)/.95 var(--font-display);letter-spacing:-.06em}.action p{max-width:300px;margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.7}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:40px}.section-head h1{font:600 clamp(3.5rem,8vw,7rem)/.85 var(--font-display);letter-spacing:-.07em;margin:16px 0 0}.two-col{display:grid;grid-template-columns:.72fr 1.28fr;gap:24px}.panel{border-radius:22px;padding:28px}.field{width:100%;padding:13px 0;border:0;border-bottom:1px solid rgba(17,17,17,.3);outline:0;background:transparent;color:var(--foreground);font-size:20px}.field:focus{border-color:var(--accent)}.fine{margin-top:50px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.8}.map-header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding:26px;border-bottom:1px solid var(--line)}.search{position:relative;width:230px}.search .field{border:1px solid var(--line);border-radius:999px;padding:11px 15px;background:rgba(255,255,255,.45);font-size:13px}.suggestions{position:absolute;z-index:600;top:47px;left:0;right:0;padding:6px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 20px 40px rgba(0,0,0,.15)}.suggestions button{display:block;width:100%;padding:9px;border:0;border-radius:10px;background:none;text-align:left;font-size:12px}.suggestions button:hover{background:#f0eee8}.map{position:relative;height:370px;overflow:hidden}.leaflet-container{height:100%;width:100%;background:#deddd6}.leaflet-tile{filter:grayscale(.85) sepia(.15)}.leaflet-control-zoom a{color:#111!important;background:#f5f4ef!important;border-color:var(--line)!important}.popular{position:absolute;z-index:500;top:16px;left:16px;display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid rgba(255,79,0,.3);border-radius:999px;padding:8px 11px;color:var(--accent);background:rgba(245,244,239,.9);font-size:10px;font-weight:700}.selected{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 26px;border-top:1px solid var(--line)}
.loading{max-width:650px;margin:auto;padding:35px 0;text-align:center}.loading h2{margin:20px 0 55px;font:600 clamp(3.2rem,7vw,6.5rem)/.86 var(--font-display);letter-spacing:-.07em}.loading-box{padding:28px;border-radius:22px;text-align:left}.load{margin-bottom:22px}.load:last-child{margin-bottom:0}.load-line{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:12px}.bar{height:4px;overflow:hidden;border-radius:9px;background:rgba(17,17,17,.1)}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .7s}.result-head{display:flex;align-items:end;justify-content:space-between;gap:25px;padding-bottom:30px;border-bottom:1px solid var(--line)}.result-head h1{margin:20px 0 0;font:600 clamp(3.5rem,8vw,7.5rem)/.83 var(--font-display);letter-spacing:-.07em}.confidence strong{display:block;margin-top:9px;color:var(--green);font:36px "Courier New",monospace}.result-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin-top:30px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{padding:10px 14px;font-size:10px}.tab.on{color:var(--accent);border-color:var(--accent)}.result-card{padding:28px;border-radius:22px}.result-card h2{margin:20px 0;font:500 clamp(2.6rem,5vw,4.4rem)/.95 var(--font-display);letter-spacing:-.06em}.result-card p{color:var(--muted);font-size:13px;line-height:1.7}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}.metric label{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.12em}.metric b{display:block;margin-top:8px;font-size:13px}.timeline{position:relative;padding-left:24px;margin-top:24px}.timeline:before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--accent),transparent)}.event{position:relative;margin-bottom:20px}.event:before{content:'';position:absolute;left:-24px;top:3px;width:9px;height:9px;border:2px solid var(--accent);border-radius:50%;background:var(--background)}.event time{color:var(--accent);font:10px "Courier New",monospace}.event span{display:block;margin-top:5px;font-size:12px}.useless{margin-top:15px;padding:22px;border:1px solid rgba(66,102,77,.3);border-radius:22px;background:rgba(66,102,77,.06)}.useless-head{display:flex;justify-content:space-between;align-items:center}.score{color:var(--green);font:24px "Courier New",monospace}.more{margin-top:15px;padding-top:14px;border-top:1px solid rgba(66,102,77,.2);color:var(--green);font-size:12px;line-height:1.8}
.certificate{position:relative;padding:48px;color:#10272d;background:#e9f0e8;border:1px solid rgba(20,92,92,.3);box-shadow:0 25px 70px rgba(17,17,17,.15)}.certificate:before{content:'';position:absolute;inset:20px;border:1px solid rgba(20,92,92,.25);pointer-events:none}.certificate-inner{position:relative}.cert-title{text-align:center;margin:58px 0 64px}.cert-title h1{margin:18px 0;font:600 clamp(3rem,7vw,6rem)/.9 Georgia,serif;letter-spacing:-.06em;color:#123a3c}.cert-name{font:clamp(2.3rem,5vw,4rem) Georgia,serif;color:#145c5c}.cert-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:30px;padding:28px 0;border-top:1px solid rgba(20,92,92,.2);border-bottom:1px solid rgba(20,92,92,.2)}.cert-metrics{display:grid;grid-template-columns:1fr 1fr;gap:18px}.cert-label{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#5d7778}.cert-value{margin-top:5px;font-weight:700;color:#145c5c}.seal{display:grid;place-items:center;width:125px;height:125px;border:1px solid rgba(20,92,92,.55);border-radius:50%;outline:5px double rgba(20,92,92,.33);outline-offset:-11px;transform:rotate(-9deg);color:#145c5c;text-align:center}.signature{text-align:right;color:#145c5c;font:18px Georgia,serif;font-style:italic}.cert-foot{display:flex;justify-content:space-between;gap:20px;margin-top:32px;color:#5d7778;font-size:10px;line-height:1.6}.cert-foot strong{text-align:right;color:#145c5c;letter-spacing:.14em}.history-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.absence-card{padding:24px;border-radius:22px;text-align:left}.absence-card h2{margin:9px 0;font:38px Georgia,serif;letter-spacing:-.05em}.absence-top{display:flex;justify-content:space-between;gap:12px}.tag{padding:5px 8px;border:1px solid rgba(186,61,32,.25);border-radius:999px;color:var(--red);font-size:9px;text-transform:uppercase;letter-spacing:.12em}.absence-bottom{display:flex;justify-content:space-between;align-items:end;margin-top:42px;padding-top:14px;border-top:1px solid var(--line)}.empty{text-align:center;padding:80px 24px;border-radius:22px}.empty-mark{display:grid;place-items:center;width:64px;height:64px;margin:auto;border:1px solid rgba(255,79,0,.35);border-radius:50%;color:var(--accent);font-size:25px}.empty h2{margin:25px 0 8px;font:40px Georgia,serif}.about{max-width:900px}.about-title{margin:20px 0 60px;font:600 clamp(4rem,10vw,8rem)/.84 var(--font-display);letter-spacing:-.08em}.about-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:35px;padding-top:35px;border-top:1px solid var(--border)}.about-copy{font-size:18px;line-height:1.8}.about-copy p{margin:0 0 24px}.callout{padding-left:18px;border-left:2px solid var(--red);color:var(--red);font-size:17px}.foot{border-top:1px solid var(--line);padding:28px 32px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.foot-inner{max-width:1180px;margin:auto;display:flex;justify-content:space-between;gap:20px}
@media(max-width:800px){.page{padding:115px 18px 65px}.hero,.two-col,.result-grid,.about-grid{grid-template-columns:1fr}.hero{min-height:auto;padding:48px 0 70px}.hero-image{min-height:330px;margin-top:30px}.learning{grid-template-columns:1fr;gap:26px;padding-bottom:75px}.learning-copy{grid-template-columns:1fr;gap:28px;margin-top:42px}.section-head,.result-head{align-items:start;flex-direction:column}.confidence{text-align:left}.history-grid{grid-template-columns:1fr 1fr}.certificate{padding:25px}.certificate:before{inset:10px}.cert-title{margin:35px 0 45px}.cert-grid{grid-template-columns:1fr}.seal{margin:auto}.signature{text-align:center}.cert-foot{flex-direction:column}.cert-foot strong{text-align:left}.metrics{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.navbar{padding:20px 16px}.logo{font-size:16px}.page{padding-inline:16px}.hero-title{font-size:4.1rem}.hero-image{min-height:285px}.history-grid{grid-template-columns:1fr}.search{width:100%}.selected{align-items:stretch;flex-direction:column}.selected .btn{width:100%}.panel{padding:20px}.map-header{padding:20px}.popular{top:10px;left:10px}.metrics{grid-template-columns:1fr 1fr}.foot{padding-inline:16px}.foot-inner{flex-direction:column}}

<body><div class="site"><header class="navbar"><a class="logo link" href="#" onclick="go('home');return false">TinkerHub</a><button class="index-button" onclick="go('home')">INDEX</button></header><div id="app"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<script>
const places=[{name:'Paris',country:'France',lat:48.8566,lng:2.3522},{name:'Tokyo',country:'Japan',lat:35.6762,lng:139.6503},{name:'Dubai',country:'United Arab Emirates',lat:25.2048,lng:55.2708},{name:'New York',country:'United States',lat:40.7128,lng:-74.006},{name:'Antarctica',country:'Earth (cold)',lat:-82.8628,lng:135},{name:'Moon',country:'Somewhere above us',lat:0,lng:0},{name:'Mars',country:'Definitely not Earth',lat:0,lng:0}];const messages=['Reality has been consulted.','No unnecessary evidence was found.','Our extremely sophisticated system agrees.','The coordinates look suspiciously far away.','We checked. You weren\'t there.','This information will probably change nothing.'];const steps=['Analyzing coordinates…','Simulating presence…','Consulting reality…','Checking whether you were actually there…'];let s={view:'home',name:'',query:'',place:null,progress:0,message:messages[0],more:0};const app=document.getElementById('app');const history=()=>JSON.parse(localStorage.getItem('absences')||'[]');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=a=>{localStorage.setItem('absences',JSON.stringify([a,...history()].slice(0,30)));localStorage.setItem('currentAbsence',JSON.stringify(a))};
function go(view){if(view==='certificate'&&s.view==='result')save(current());s.view=view;render();scrollTo({top:0,behavior:'smooth'})}function frame(c,foot=true){return `<main class="page">${c}</main>${foot?'<footer class="foot"><div class="foot-inner"><span>WHERE AM I NOT? © 2026</span><span class="accent">USEFULNESS: 0% / ENTERTAINMENT: 100%</span></div></footer>':''}`}function render(){if(s.view==='home')home();if(s.view==='create')create();if(s.view==='loading')loading();if(s.view==='result')result();if(s.view==='certificate')certificate();if(s.view==='history')historyView();if(s.view==='about')about();if(s.view==='home')setTimeout(reveal,0)}function reveal(){if(!('IntersectionObserver'in window)){document.querySelectorAll('.reveal').forEach(x=>x.classList.add('visible'));return}const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');o.unobserve(e.target)}}),{threshold:.15});document.querySelectorAll('.reveal').forEach(x=>o.observe(x))}
function home(){app.innerHTML=frame(`<section class="hero reveal"><div><p class="eyebrow">Absence intelligence / v. 3.7</p><h1 class="hero-title">the space between<br><em>dream &amp;<br>reality</em></h1><p class="hero-copy">A premium interface for imaginary presence, definitive absence, and information that changes absolutely nothing.</p><div class="actions"><button class="btn primary" onclick="go('create')">Create absence ↗</button><button class="btn" onclick="go('about')">Read the premise</button></div></div><div class="hero-image"><div class="image-art"></div><div class="image-caption">A visual representation of somewhere you are not. Coordinates intentionally unavailable.</div></div></section><section class="learning reveal"><span class="mono">01</span><div><h2>Learning Paradigm</h2><div class="learning-copy"><strong>Imagine first.<br>Verify later.</strong><p>WHERE AM I NOT? uses the language of serious technology to explore an unserious question. Select a destination, enter a fictional presence, and receive an officially unofficial confirmation that you were not there.</p></div></div></section><section class="action-list reveal"><h2 class="actions-title">What happens next</h2><article class="action"><span>01</span><div><h3>Learn &amp; Lead</h3><p>Dive into peer-driven learning stations and discover how absence can become a practice.</p></div></article><article class="action"><span>02</span><div><h3>Build &amp; Innovate</h3><p>Turn ideas into reality, even when the reality is entirely fictional.</p></div></article><article class="action"><span>03</span><div><h3>Connect &amp; Grow</h3><p>Network with industry pros and other people who were definitely not there.</p></div></article></section>`)}
function create(){app.innerHTML=frame(`<div class="section-head"><div><p class="eyebrow">Absence protocol / create</p><h1>Build your <span class="accent">absence.</span></h1></div><button class="btn" onclick="go('history')">View history ↗</button></div><div class="two-col"><div class="glass panel"><p class="eyebrow">01 / Identity</p><label for="name" style="display:block;margin-top:45px">What is your name?</label><input id="name" class="field" placeholder="e.g. Mohammed Adil S" value="${esc(s.name)}" oninput="s.name=this.value;syncStart()"><p class="muted" style="font-size:12px;margin-top:10px">We need someone to not be there.</p><div class="fine"><p class="eyebrow">The fine print</p><p>All results are fictional simulations for entertainment. No GPS evidence will be created, because that would be difficult and unnecessary.</p></div></div><div class="glass" style="border-radius:22px;overflow:hidden"><div class="map-header"><div><p class="eyebrow">02 / Destination</p><h2 style="margin:10px 0 0;font-size:20px">Where do you want to pretend you were?</h2></div><div class="search"><input id="query" class="field" placeholder="Search a place…" value="${esc(s.query)}" oninput="s.query=this.value;suggest()"><div id="suggestions" class="suggestions" hidden></div></div></div><div class="map"><div id="map" style="height:100%"></div><div class="popular">${places.map(p=>`<button class="chip" onclick="choose('${p.name}')">${p.name}</button>`).join('')}</div></div><div class="selected"><div>${s.place?`<p class="eyebrow">Destination selected</p><div style="font-size:18px;margin-top:5px">${esc(s.place.name)} <span class="muted" style="font-size:13px">${esc(s.place.country)}</span></div>`:'<p class="muted" style="font-size:13px">Select a destination on the map or choose a popular place.</p>'}</div><button id="start" class="btn primary" onclick="begin()" disabled>Prepare fictional presence →</button></div></div></div>`);syncStart();setTimeout(initMap,0)}
function syncStart(){const b=document.getElementById('start');if(b)b.disabled=false}function suggest(){const box=document.getElementById('suggestions');const q=s.query.toLowerCase();const list=places.filter(p=>(p.name+' '+p.country).toLowerCase().includes(q));if(!q||!list.length){box.hidden=true;return}box.innerHTML=list.map(p=>`<button onclick="choose('${p.name}')"><span class="accent">${p.name}</span> <span class="muted">${p.country}</span></button>`).join('');box.hidden=false}function choose(name){s.place=places.find(p=>p.name===name)||{name:'Selected coordinates',country:'Earth',lat:0,lng:0};s.query=s.place.name;create()}function initMap(){const el=document.getElementById('map');if(!el||!window.L)return;const map=L.map(el).setView([22,10],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);map.on('click',e=>{s.place={name:'Selected coordinates',country:'Earth',lat:e.latlng.lat,lng:e.latlng.lng};s.query='Selected coordinates';create()});if(s.place&&s.place.lat!==0)L.marker([s.place.lat,s.place.lng]).addTo(map).bindPopup('Fictional destination marker').openPopup()}
function begin(){if(!s.name.trim()){document.getElementById('name')?.focus();return}if(!s.place){document.getElementById('query')?.focus();return}s.view='loading';s.progress=0;loading();const t=setInterval(()=>{s.progress++;loading();if(s.progress>=4){clearInterval(t);s.message=messages[Math.floor(Math.random()*messages.length)];s.view='result';result()}},800)}function loading(){app.innerHTML=frame(`<div class="loading reveal visible"><p class="eyebrow">Destination selected / ${esc(s.place?.name)}</p><h2>Preparing<br><span class="accent">fictional presence.</span></h2><div class="glass loading-box"><div style="display:flex;justify-content:space-between;margin-bottom:28px"><span class="mono accent">SIMULATION_ENGINE</span><span class="mono muted">${String(s.progress*25).padStart(3,'0')}%</span></div>${steps.map((x,i)=>`<div class="load" style="opacity:${i<s.progress?1:.35}"><div class="load-line"><span>${i<s.progress?'✓':'○'} &nbsp;${x}</span><span class="mono muted">${i<s.progress?'COMPLETE':'WAITING'}</span></div><div class="bar"><i style="width:${i<s.progress?100:0}%"></i></div></div>`).join('')}</div><p class="muted" style="font-size:11px;margin-top:22px">Every result on this screen is fictional and simulated.</p></div>`)}
function current(){const p=s.place;const absurd=['Moon','Mars','Antarctica'].includes(p.name);const distance=p.name==='Moon'?'384,400 km':p.name==='Mars'?'225M km':Math.max(6420,Math.round(Math.abs((p.lng||0)-78.9)*71)).toLocaleString()+' km';return{id:'WAIN-'+Date.now().toString(36).toUpperCase(),name:s.name.trim(),destination:p.name,country:p.country,date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),time:new Date().toLocaleTimeString('en-GB'),confidence:'99.99%',distance,uselessness:(97.2+(absurd?2.1:1.3)).toFixed(2)+'%'}}
function result(){const a=current();const special=a.destination==='Moon'?'Distance detected: unnecessarily far.':a.destination==='Mars'?'We strongly recommend remaining on Earth.':a.destination==='Antarctica'?'Excellent choice. Nobody needed this verification.':a.destination==='Selected coordinates'?'Congratulations. You have chosen somewhere extremely inconvenient to be.':'';app.innerHTML=frame(`<div class="result-head reveal visible"><div><p class="eyebrow"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px"></span>Result ready / fictional simulation</p><h1>YOU WERE<br><span class="red">NOT THERE.</span></h1></div><div class="confidence"><p class="eyebrow">Absence confidence</p><strong>99.99%</strong></div></div><div class="result-grid"><div><div class="tabs"><button id="verify" class="btn tab on" onclick="tab('verify')">Verification</button><button id="presence" class="btn tab" onclick="tab('presence')">Imaginary presence</button></div><div id="result-card" class="glass result-card"><p class="eyebrow">Reality check / definitive</p><h2>${esc(s.message)}</h2>${special?`<p style="padding:12px;border:1px solid rgba(255,79,0,.25);border-radius:12px;color:var(--accent)">${special}</p>`:''}<div class="metrics"><div class="metric"><label>Distance from selected location</label><b>${a.distance}</b></div><div class="metric"><label>Reality status</label><b class="red">NOT THERE</b></div><div class="metric"><label>Presence status</label><b class="accent">FICTIONAL</b></div><div class="metric"><label>Useful information gained</label><b>0</b></div><div class="metric"><label>Uselessness level</label><b class="green">MAXIMUM</b></div></div></div></div><div><div class="glass panel"><p class="eyebrow">The absence timeline</p><div class="timeline">${[['15:42:01','Location selected'],['15:42:03','Imaginary presence generated'],['15:42:07','Reality consulted'],['15:42:08','Absence confirmed'],['15:42:09','Certificate prepared'],['15:42:10','Your time was successfully wasted']].map(x=>`<div class="event"><time>${x[0]}</time><span>${x[1]}</span></div>`).join('')}</div></div><div class="useless"><div class="useless-head"><p class="eyebrow green">Uselessness score</p><span class="score">${a.uselessness}</span></div><p class="muted" style="font-size:12px;line-height:1.6">This score has absolutely no scientific basis.</p><button class="btn" style="padding:9px 12px;font-size:9px" onclick="more()">Make my absence more useless ↗</button><div id="more"></div></div></div></div><p class="disclaimer muted" style="margin-top:24px;font-size:10px;text-transform:uppercase;letter-spacing:.14em">FOR ENTERTAINMENT ONLY — NOT AN OFFICIAL DOCUMENT.</p><div class="actions"><button class="btn primary" onclick="save(current());go('certificate')">Generate certificate ↗</button><button class="btn" onclick="save(current());go('history')">Save &amp; view history</button></div>`)}
function tab(type){const a=current(),c=document.getElementById('result-card');document.getElementById('verify').classList.toggle('on',type==='verify');document.getElementById('presence').classList.toggle('on',type==='presence');c.innerHTML=type==='verify'?`<p class="eyebrow">Reality check / definitive</p><h2>${esc(s.message)}</h2><div class="metrics"><div class="metric"><label>Distance from selected location</label><b>${a.distance}</b></div><div class="metric"><label>Reality status</label><b class="red">NOT THERE</b></div><div class="metric"><label>Presence status</label><b class="accent">FICTIONAL</b></div><div class="metric"><label>Useful information gained</label><b>0</b></div></div>`:`<p class="eyebrow accent">Your imaginary presence</p><h2>We placed you in ${esc(a.destination)}.</h2><p>For approximately 7 seconds, our imagination placed you here. This is a simulated experience, not proof of travel or physical presence.</p><div class="metrics"><div class="metric"><label>Name</label><b>${esc(a.name)}</b></div><div class="metric"><label>Destination</label><b>${esc(a.destination)}</b></div><div class="metric"><label>Status</label><b class="green">SIMULATED</b></div><div class="metric"><label>Reality check</label><b class="red">You were NOT there.</b></div></div>`}function more(){s.more++;document.getElementById('more').innerHTML=`<div class="more">Your absence has been verified ${17+s.more} times.<br>You were not there: ${(1847392+s.more*31415).toLocaleString()} seconds.<br>People who care: Probably 0<br>Scientific significance: None. Historical significance: Also none.</div>`}
function certificate(){const a=JSON.parse(localStorage.getItem('currentAbsence')||'null')||{id:'WAIN-DEMO-000',name:'Mohammed Adil S',destination:'Tokyo',country:'Japan',date:'12 Sep 2026',time:'15:42:10',confidence:'99.99%',distance:'6,420 km',uselessness:'99.97%'};app.innerHTML=frame(`<div class="section-head no-print"><div><p class="eyebrow">Archive / certificate</p><h1>The official<br><span class="accent">unofficial</span> record.</h1></div><div class="actions" style="margin:0"><button class="btn primary" onclick="download()">Download certificate ↓</button><button class="btn" onclick="print()">Print</button></div></div><div id="paper" class="certificate"><div class="certificate-inner"><div style="display:flex;justify-content:space-between"><div><p class="mono" style="color:#397878">WAIN / ABSENCE INTELLIGENCE LAB</p><p style="font-size:10px;color:#5d7778">Verification file · ${esc(a.id)}</p></div><span style="display:grid;place-items:center;width:40px;height:40px;border:1px solid #397878;border-radius:50%">◉</span></div><div class="cert-title"><p style="font-style:normal;text-transform:uppercase;letter-spacing:.35em;font-size:10px;color:#5d7778">Officially Unofficial Verification of Absence</p><h1>Certificate of<br>Not Being There</h1><p>This certifies that</p><div class="cert-name">${esc(a.name)}</div><p>was officially NOT PRESENT at</p><h2 style="margin:8px 0;color:#123a3c">${esc(a.destination)}, ${esc(a.country)}</h2><div style="color:#5d7778;font-size:13px">on ${esc(a.date)} · ${esc(a.time)}</div></div><div class="cert-grid"><div class="cert-metrics"><div><div class="cert-label">Absence confidence</div><div class="cert-value">${a.confidence}</div></div><div><div class="cert-label">Distance</div><div class="cert-value">${a.distance}</div></div></div><div class="seal"><div><b style="font-size:9px;letter-spacing:.15em">VERIFIED</b><br><b style="font-size:18px">ABSENT™</b><br><small>ABSENCE LAB</small></div></div><div><div class="cert-label" style="text-align:right">Uselessness score</div><div class="cert-value" style="text-align:right;font-size:20px">${a.uselessness}</div><div class="signature">Director of<br>Unnecessary Information</div></div></div><div class="cert-foot"><span>The information contained herein is fictional, simulated, and has no legal, scientific, travel, or evidentiary value whatsoever.</span><strong>FOR ENTERTAINMENT ONLY<br>— NOT AN OFFICIAL DOCUMENT —</strong></div></div></div></div><div class="actions no-print"><button class="btn primary" onclick="go('create')">Create another absence ↗</button><button class="btn" onclick="go('history')">View all absences</button></div>`)}
async function download(){const el=document.getElementById('paper');if(window.html2canvas&&window.jspdf){const canvas=await html2canvas(el,{scale:2,backgroundColor:'#e9f0e8'});const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'px',format:[canvas.width,canvas.height]});pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,canvas.width,canvas.height);pdf.save('certificate-of-not-being-there.pdf')}else print()}
function historyView(){const list=history();app.innerHTML=frame(`<div class="section-head"><div><p class="eyebrow">Archive / personal absence log</p><h1>Your <span class="accent">absences.</span></h1><p class="muted" style="max-width:430px;line-height:1.7">A completely private, local-only record of places you have not been.</p></div><div class="actions" style="margin:0"><button class="btn" ${list.length?'':'disabled'} onclick="localStorage.removeItem('absences');historyView()">Delete my absences</button><button class="btn primary" onclick="go('create')">New absence ↗</button></div></div>${list.length?`<div class="history-grid">${list.map((a,i)=>`<button class="glass absence-card" onclick="openHistory(${i})"><div class="absence-top"><div><p class="eyebrow">${esc(a.country)}</p><h2>${esc(a.destination)}</h2></div><span class="tag">Absent</span></div><div class="absence-bottom"><div><div class="mono green">${a.confidence}</div><small class="muted">Absence confidence</small></div><small class="muted">${esc(a.date)}</small></div></button>`).join('')}</div>`:`<div class="glass empty"><div class="empty-mark">◌</div><h2>No absences on file.</h2><p class="muted">An empty archive is a pristine archive.</p><button class="btn primary" onclick="go('create')">Create your first absence ↗</button></div>`}`)}function openHistory(i){localStorage.setItem('currentAbsence',JSON.stringify(history()[i]));go('certificate')}
function about(){app.innerHTML=frame(`<div class="about"><p class="eyebrow">Manifesto / the original non-problem</p><h1 class="about-title">WHY DID<br><span class="accent">WE BUILD</span><br>THIS?</h1><div class="about-grid"><p class="eyebrow">A note from the lab</p><div class="about-copy"><p>Every modern application tries to solve an important problem.</p><p>We decided to do the opposite.</p><p>“WHERE AM I NOT?” uses geolocation, interactive maps and unnecessarily sophisticated verification to answer a question nobody needed answered.</p><p class="accent" style="font:32px/1.15 Georgia,serif">Because sometimes technology doesn't need a purpose.</p><p class="muted" style="font-size:13px">Every destination, score, presence and verification in this experience is fictional or simulated. This project does not create proof of travel, GPS evidence, bookings, receipts, government documents, or anything that could be mistaken for genuine evidence.</p><div class="callout">We spent a hackathon building proof that you weren't somewhere.</div></div></div><div class="actions"><button class="btn primary" onclick="go('create')">Start being absent ↗</button><button class="btn" onclick="go('home')">Return home</button></div></div>`)}
render();
</script></body></html>
